services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pi-web-cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:?Copy .env.example to .env and set CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      - pi-web
    restart: unless-stopped
